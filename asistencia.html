<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia - Control Equipo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">⚽ Control Equipo</div>
            <div class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="jugadoras.html">Jugadoras</a>
                <a href="calendario.html">Calendario</a>
                <a href="asistencia.html" class="active">Asistencia</a>
                <a href="control_peso.html">Peso</a>
                <a href="rpe.html">RPE</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h1>Control de Asistencia</h1>
            <p>Registra la asistencia de las jugadoras</p>
        </div>

        <div class="section-card" style="margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem;">
                <input type="date" id="filtroFecha" style="padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 6px; flex: 1;">
                <button class="btn btn-primary" onclick="abrirModalAgregar()">➕ Registrar Asistencia</button>
            </div>
        </div>

        <div id="tablaAsistencia"></div>
    </div>

    <!-- Modal -->
    <div id="modalAsistencia" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Registrar Asistencia</h2>
                <button class="close-btn" onclick="cerrarModal('modalAsistencia')">×</button>
            </div>
            <form id="formAsistencia" onsubmit="guardarAsistencia(event)">
                <div class="form-group">
                    <label>Jugadora *</label>
                    <select id="jugadora" required>
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha *</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label>Estado *</label>
                    <select id="estado" required>
                        <option value="">Seleccionar...</option>
                        <option value="Presente">✅ Presente</option>
                        <option value="Ausente">❌ Ausente</option>
                        <option value="Justificado">⚠️ Justificado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Observaciones</label>
                    <textarea id="observaciones" placeholder="Comentarios adicionales..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn btn-success" style="flex: 1;">💾 Guardar</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="cerrarModal('modalAsistencia')">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function cargarAsistencias() {
            const asistencias = AppData.obtenerAsistencias();
            const jugadoras = AppData.obtenerJugadoras();
            const contenedor = document.getElementById('tablaAsistencia');

            if (asistencias.length === 0) {
                contenedor.innerHTML = '<p class="empty-state">No hay registros de asistencia</p>';
                return;
            }

            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Jugadora</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${asistencias.map(a => {
                            const jugadora = jugadoras.find(j => j.id == a.jugadoraId);
                            const iconoEstado = a.estado === 'Presente' ? '✅' : a.estado === 'Ausente' ? '❌' : '⚠️';
                            return `
                                <tr>
                                    <td>${jugadora?.nombre || 'Desconocida'}</td>
                                    <td>${formatearFecha(a.fecha)}</td>
                                    <td>${iconoEstado} ${a.estado}</td>
                                    <td>${a.observaciones || '-'}</td>
                                    <td>
                                        <button class="btn btn-danger" onclick="eliminarAsistencia(${a.id})">🗑️</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            contenedor.innerHTML = html;
        }

        function cargarJugadorasSelect() {
            const jugadoras = AppData.obtenerJugadoras();
            const select = document.getElementById('jugadora');
            select.innerHTML = '<option value="">Seleccionar...</option>' + 
                jugadoras.map(j => `<option value="${j.id}">${j.nombre}</option>`).join('');
        }

        function abrirModalAgregar() {
            document.getElementById('formAsistencia').reset();
            document.getElementById('fecha').valueAsDate = new Date();
            cargarJugadorasSelect();
            abrirModal('modalAsistencia');
        }

        function guardarAsistencia(event) {
            event.preventDefault();
            
            const asistencia = {
                jugadoraId: parseInt(document.getElementById('jugadora').value),
                fecha: document.getElementById('fecha').value,
                estado: document.getElementById('estado').value,
                presente: document.getElementById('estado').value === 'Presente',
                observaciones: document.getElementById('observaciones').value
            };

            if (asistencia.jugadoraId && asistencia.estado) {
                AppData.agregarAsistencia(asistencia);
                alert('✅ Asistencia registrada');
                cerrarModal('modalAsistencia');
                cargarAsistencias();
            }
        }

        function eliminarAsistencia(id) {
            if (confirm('¿Eliminar este registro?')) {
                const datos = AppData.obtenerDatos();
                datos.asistencia = datos.asistencia.filter(a => a.id != id);
                AppData.guardarDatos(datos);
                alert('✅ Eliminado');
                cargarAsistencias();
            }
        }

        // Cargar al iniciar
        cargarAsistencias();
        cargarJugadorasSelect();
        document.getElementById('filtroFecha').valueAsDate = new Date();
    </script>
</body>
</html>
